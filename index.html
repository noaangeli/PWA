<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>PWA-ConvertisseurMonnaie</title>

    <link rel="stylesheet" href="style.css" />
    <link rel="manifest" href="manifest.json" />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap"
      rel="stylesheet"
    />

    <meta name="mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <link rel="apple-touch-icon" href="icon512_maskable.png" />
    <meta name="theme-color" content="#000112" />

    <script src="https://cdn.jsdelivr.net/npm/idb@7/build/umd.js"></script>

    <script src="db.js"></script>
    <script type="module" src="app.js"></script>
  </head>

  <body>
    <header class="app-header">
      <h1 class="titre">Convertir</h1>
      <button id="install-btn" class="hidden">Installer</button>
    </header>

    <main id="content" class="container">
      <div class="converter-card">
        <div class="input-group">
          <label for="base-currency">Monnaie de départ</label>
          <select id="base-currency">
            <option value="EUR" selected>EUR - Euro</option>
            <option value="USD">USD - Dollar US</option>
            <option value="GBP">GBP - Livre Sterling</option>
            <option value="JPY">JPY - Yen Japonais</option>
            <option value="CAD">CAD - Dollar Canadien</option>
          </select>
        </div>

        <div class="input-group">
          <label for="amount-input">Montant à convertir</label>
          <input
            type="number"
            id="amount-input"
            value="1"
            inputmode="decimal"
          />
        </div>

        <div class="input-group">
          <label for="currency-select">Convertir en</label>
          <select id="currency-select">
            <option value="USD" selected>USD - Dollar US</option>
            <option value="EUR">EUR - Euro</option>
            <option value="GBP">GBP - Livre Sterling</option>
            <option value="JPY">JPY - Yen Japonais</option>
            <option value="CHF">CHF - Franc Suisse</option>
          </select>
        </div>

        <div class="result-section">
          <span id="result-value">--.--</span>
          <p id="last-update">Chargement...</p>
        </div>
      </div>
    </main>

    <div id="offline-banner" class="offline-banner">
      ⚠️ Mode Hors-Ligne (Taux mis en cache)
    </div>

    <div id="update-notification" class="update-toast" style="display: none">
      Nouvelle version disponible !
      <button id="reload-btn">Mettre à jour</button>
    </div>

    <footer class="tab-bar">
      <div class="status-info">App prête pour l'usage avion ✈️</div>
    </footer>
  </body>
</html>
